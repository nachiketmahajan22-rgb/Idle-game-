<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f0"/>
      <stop offset="55%" stop-color="#cfcdd6"/>
      <stop offset="100%" stop-color="#8d8b96"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2b4d"/>
      <stop offset="100%" stop-color="#b3121f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#2a2a35" stroke-width="10"/>
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>

  <!-- crossed blades, centered, safe within adaptive-icon zone -->
  <g filter="url(#softGlow)">
    <g transform="translate(512,512) rotate(-40)">
      <rect x="-26" y="-330" width="52" height="430" rx="10" fill="url(#blade)"/>
      <polygon points="-26,-330 26,-330 0,-420" fill="url(#blade)"/>
      <rect x="-58" y="80" width="116" height="40" rx="10" fill="url(#glow)"/>
      <rect x="-22" y="100" width="44" height="150" rx="8" fill="#5a4632"/>
    </g>
    <g transform="translate(512,512) rotate(40) scale(-1,1)">
      <rect x="-26" y="-330" width="52" height="430" rx="10" fill="url(#blade)"/>
      <polygon points="-26,-330 26,-330 0,-420" fill="url(#blade)"/>
      <rect x="-58" y="80" width="116" height="40" rx="10" fill="url(#glow)"/>
      <rect x="-22" y="100" width="44" height="150" rx="8" fill="#5a4632"/>
    </g>
  </g>

  <!-- ember particles -->
  <circle cx="330" cy="260" r="6" fill="#ff2b4d" opacity="0.8"/>
  <circle cx="700" cy="300" r="4" fill="#ffd23f" opacity="0.7"/>
  <circle cx="640" cy="720" r="5" fill="#ff2b4d" opacity="0.6"/>
  <circle cx="360" cy="700" r="3" fill="#ffd23f" opacity="0.6"/>
</svg>
