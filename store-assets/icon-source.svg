<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#241608"/>
      <stop offset="100%" stop-color="#0a0602"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f4f0"/>
      <stop offset="55%" stop-color="#cfcdd6"/>
      <stop offset="100%" stop-color="#8d8b96"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffab4a"/>
      <stop offset="100%" stop-color="#c9600f"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="512" cy="512" r="430" fill="none" stroke="#3a2a18" stroke-width="10"/>
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>

  <!-- crossed curved talwars, centered, safe within adaptive-icon zone -->
  <g filter="url(#softGlow)">
    <g transform="translate(512,512) rotate(-40)">
      <path d="M-24,-330 C-40,-140 -30,60 -18,110 L18,110 C22,60 26,-140 22,-330
               C10,-360 -10,-360 -24,-330 Z" fill="url(#blade)"/>
      <polygon points="-22,-330 20,-330 -2,-420" fill="url(#blade)"/>
      <rect x="-58" y="110" width="116" height="38" rx="10" fill="url(#glow)"/>
      <rect x="-22" y="128" width="44" height="150" rx="8" fill="#5a4632"/>
    </g>
    <g transform="translate(512,512) rotate(40) scale(-1,1)">
      <path d="M-24,-330 C-40,-140 -30,60 -18,110 L18,110 C22,60 26,-140 22,-330
               C10,-360 -10,-360 -24,-330 Z" fill="url(#blade)"/>
      <polygon points="-22,-330 20,-330 -2,-420" fill="url(#blade)"/>
      <rect x="-58" y="110" width="116" height="38" rx="10" fill="url(#glow)"/>
      <rect x="-22" y="128" width="44" height="150" rx="8" fill="#5a4632"/>
    </g>
  </g>

  <!-- fort silhouette at the base, evoking Raigad -->
  <g opacity="0.85">
    <rect x="392" y="800" width="240" height="60" fill="#1a0f06"/>
    <rect x="392" y="770" width="30" height="30" fill="#1a0f06"/>
    <rect x="442" y="770" width="30" height="30" fill="#1a0f06"/>
    <rect x="492" y="760" width="40" height="40" fill="#1a0f06"/>
    <rect x="552" y="770" width="30" height="30" fill="#1a0f06"/>
    <rect x="602" y="770" width="30" height="30" fill="#1a0f06"/>
    <rect x="502" y="720" width="20" height="45" fill="#1a0f06"/>
    <polygon points="512,700 522,720 502,720" fill="#c9600f"/>
  </g>

  <!-- ember particles -->
  <circle cx="330" cy="260" r="6" fill="#ffab4a" opacity="0.8"/>
  <circle cx="700" cy="300" r="4" fill="#ffd23f" opacity="0.7"/>
  <circle cx="640" cy="230" r="5" fill="#ffab4a" opacity="0.6"/>
  <circle cx="360" cy="220" r="3" fill="#ffd23f" opacity="0.6"/>
</svg>
