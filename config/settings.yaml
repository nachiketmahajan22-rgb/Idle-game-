# Positional trading agent configuration
# Secrets (API keys/tokens) go in .env, NOT here.

# --- Strategy selection ---
# breakout: Donchian-channel breakout + ATR risk (see screener_mode/stop_method
#   below). Configured below for POSITIONAL trading (weeks-to-months holds,
#   ~130-160 day average) -- see lookback_range_days/atr_stop_multiple/
#   trail_after_r_multiple/atr_trail_multiple, each commented with its
#   original swing-trading (~30-40 day hold) value if you want to revert.
# mean_reversion: buy pullbacks to MA5 - N*ATR5, exit on the first up-day or
#   a max hold of days. Structurally short-term (1-5 day holds) -- cannot
#   serve a positional goal regardless of tuning. Kept in the repo, tested
#   and working, but not the active focus while strategy_style: breakout
#   (positional) is the target -- parked, not deleted.
strategy_style: breakout

# --- Capital & risk management ---
capital: 50000                # total ₹ capital allocated to this strategy
risk_pct_per_trade: 0.01     # risk 1% of capital per trade
max_open_positions: 5        # max concurrent swing positions
max_daily_loss_pct: 0.03     # stop opening new trades after losing 3% of capital in a day
reward_risk_min: 1.5         # skip signals with reward:risk below this

# --- Screener thresholds (stock shortlist) ---
# screener_mode: simple (recommended) = trend filter + liquidity floor only.
#   Fewer, more robust conditions -> less overfit to backtest noise.
# screener_mode: full = the original Kar-style stack (RSI band, SMA, MACD,
#   volume surge, near-range check) -- kept for comparison/backtesting.
screener_mode: simple
trend_sma_period: 200          # "simple" mode: only trade stocks above their 200-day trend
min_avg_volume: 200000          # "simple" mode: liquidity floor, avg shares/day over 20 days
rsi_period: 14                   # "full" mode only, below
rsi_min: 50
rsi_max: 70
sma_period: 26                    # "full" mode's shorter trend check (Kar references 26 SMA)
volume_surge_multiple: 1.5         # "full" mode: today's volume vs 20-day average
lookback_range_days: 55              # Donchian/breakout lookback (both modes) -- "N-day high breakout".
                                       # Positional: 55 (long-term breakout horizon). Swing value was 20.

# --- Breakout entry rules ---
breakout_confirmation: close   # 'close' = candle must close beyond the range (fewer false breakouts)
# stop_method: atr (recommended) = entry -/+ atr_stop_multiple x ATR. Scales
#   with the stock's actual volatility -- never accidentally tiny like a
#   single candle's wick can be.
# stop_method: candle = original Kar-style stop at the breakout bar's low/high.
stop_method: atr
atr_stop_multiple: 4.0          # Positional: 4.0 (more room for a multi-month hold). Swing value was 2.5.
use_fixed_target: false        # false (recommended): no fixed take-profit, let the trailing
                                 # stop harvest the trade -- standard trend-following practice.
                                 # true = Kar-style fixed target (range height projected from entry).
trail_after_r_multiple: 2.0    # Positional: 2.0 (don't protect profit until 2R). Swing value was 1.0.
trail_method: breakeven        # 'breakeven' = floor at entry once armed, then keeps
                                # ratcheting up via ATR as price extends (never freezes).
                                # 'atr' = pure ATR trail, no explicit breakeven floor.
atr_period: 14
atr_trail_multiple: 3.5           # Positional: 3.5 (trail looser once armed). Swing value was 2.0.

# --- Market regime & relative-strength filters (breakout screener only) ---
# A/B backtested (README's strategy-comparison section): baseline vs
# +regime vs +regime+RS, both universes, full-4yr/last-2yr/last-1yr windows.
# +regime alone wasn't consistently better. +regime+RS turned the last-1yr
# avg R-multiple from clearly negative to clearly positive on BOTH Nifty 50
# (-0.41 -> +0.47) and Nifty 200 (-0.24 -> +0.24), roughly doubled win rate,
# and cut max drawdown by more than half on both -- so both are on by
# default. Caveat: only 9-12 trades in that winning last-1yr sample per
# universe -- directionally consistent across two universes, but
# statistically thin; re-validate before trusting this over a longer
# stretch. When on, requires the benchmark index's OHLCV to be supplied to
# screen_symbol()/find_new_entries_breakout() -- fails loudly rather than
# silently skipping if that's missing.
use_regime_filter: true         # only take new trades when the benchmark index
                                  # is itself above its own regime_sma_period SMA.
regime_index_symbol: "^NSEI"      # benchmark index for your configured universe --
                                    # ^NSEI (Nifty 50) or ^CNX200 (Nifty 200); match
                                    # this to whatever universe_file actually holds.
regime_sma_period: 200
use_relative_strength_filter: true    # only trade stocks outperforming the benchmark
                                        # index over rs_lookback_days (IBD-style RS).
rs_lookback_days: 252
rs_min_relative_return: 0.0             # stock's weighted return must exceed the
                                          # index's by at least this much (0.0 = merely beating it)

# --- Mean-reversion strategy (only used when strategy_style: mean_reversion) ---
mr_ma_period: 5                # short MA the pullback is measured against
mr_atr_period: 5                # ATR period for the entry band, stop, and volatility floor
mr_entry_atr_multiple: 1.0       # signal: close < MA5 - this x ATR5
mr_limit_atr_multiple: 0.75       # next-day limit price: signal_close - this x ATR5
mr_stop_atr_multiple: 2.0          # hard stop: entry - this x ATR5 (not in the original rule --
                                     # added so a single bad gap can't go unprotected)
mr_max_hold_days: 5                  # force-exit if neither a stop nor a rising day closes it first
mr_min_atr_pct: 0.005                 # skip stocks with ATR5/close below this (too quiet to trade)

# --- Universe ---
universe_file: config/watchlist.csv

# --- Transaction costs (NSE delivery/CNC, discount-broker schedule) ---
# See swing_agent/costs.py for the full breakdown. Applied in backtests and
# in PaperBroker so simulated P&L matches what you'd actually keep.
brokerage_flat: 0.0            # ₹0 -- standard for delivery on discount brokers (Zerodha et al.)
stt_pct: 0.001                  # 0.1% Securities Transaction Tax, BOTH buy and sell
stamp_duty_pct: 0.00015          # 0.015%, buy side only
exchange_txn_pct: 0.0000345       # 0.00345% NSE exchange transaction charge, both sides
gst_pct: 0.18                      # 18% GST on (brokerage + exchange transaction charges)
dp_charge_flat: 15.34               # ₹ flat, per scrip per day sold (depository participant fee)

# --- Execution ---
broker: kite                  # kite | paper (paper forces simulated fills regardless of live_trading)
live_trading: false            # master switch — must ALSO set LIVE_TRADING=true in .env
order_product: CNC              # CNC = delivery/swing, not intraday (MIS)
order_type: MARKET
allow_shorts: false              # NSE cash equity CNC (delivery) can't hold a short overnight —
                                  # only intraday MIS allows short-selling, squared off same day.
                                  # Leave false unless you've adapted this for F&O/MIS.

# --- Notifications ---
notify_telegram: false          # requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env

# --- Logging ---
log_dir: logs
