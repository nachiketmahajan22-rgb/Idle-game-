<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="cloakGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#4f9459"/>
      <stop offset="100%" stop-color="#255c2c"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#e8ddc4"/>
      <stop offset="100%" stop-color="#c4b790"/>
    </radialGradient>
    <radialGradient id="turbanGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#5fa868"/>
      <stop offset="100%" stop-color="#2f6e37"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="170" rx="105" ry="112" fill="none" stroke="#3a7d44" stroke-width="3" opacity="0.3" filter="url(#glow)"/>

  <path d="M114,134 C76,162 58,216 70,268 C92,296 208,296 230,268 C242,216 224,162 186,134
           C180,154 120,154 114,134 Z" fill="url(#cloakGrad)"/>
  <path d="M114,134 C94,178 92,230 102,270" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>
  <path d="M186,134 C206,178 208,230 198,270" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="3"/>

  <path d="M150,144 L172,164 L166,244 L150,258 L134,244 L128,164 Z" fill="url(#bodyGrad)" stroke="#5c4a28" stroke-width="2.5"/>
  <path d="M150,152 C157,170 159,206 153,240 L150,246 L147,240 C141,206 141,170 150,152 Z" fill="#2f6e37" opacity="0.7"/>
  <rect x="128" y="210" width="44" height="11" rx="3" fill="#5c3a1a"/>

  <!-- Maratha war belt with a sheathed talwar at the hip -->
  <path d="M120,196 L106,236 L120,242 L134,202 Z" fill="#8a8a7a" opacity="0.9"/>
  <rect x="112" y="188" width="10" height="12" fill="#5c3a1a"/>

  <!-- simpler soldier's pagadi, no jewel ornament - a field commander, not royalty -->
  <path d="M150,58 C186,60 200,92 194,120 C190,134 110,134 106,120 C100,92 114,60 150,58 Z"
        fill="url(#turbanGrad)" stroke="#1e4a23" stroke-width="2"/>
  <path d="M114,82 C132,75 168,75 186,82" fill="none" stroke="#1e4a23" stroke-width="2" opacity="0.6"/>
  <path d="M110,100 C130,93 170,93 190,100" fill="none" stroke="#1e4a23" stroke-width="2" opacity="0.6"/>
  <path d="M107,114 C128,109 172,109 193,114" fill="none" stroke="#1e4a23" stroke-width="2" opacity="0.6"/>

  <ellipse cx="150" cy="122" rx="23" ry="19" fill="#2a1c10" opacity="0.9"/>
  <path d="M137,129 C143,135 157,135 163,129" fill="none" stroke="#140c06" stroke-width="3" opacity="0.85"/>

  <ellipse cx="136" cy="274" rx="12" ry="6" fill="#1e2c1e" opacity="0.8"/>
  <ellipse cx="164" cy="274" rx="12" ry="6" fill="#1e2c1e" opacity="0.8"/>
</svg>
