<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="cloakGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#e0731c"/>
      <stop offset="100%" stop-color="#a6440a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#f5ecd8"/>
      <stop offset="100%" stop-color="#dcd0ac"/>
    </radialGradient>
    <radialGradient id="turbanGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#ffab4a"/>
      <stop offset="100%" stop-color="#c9600f"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#d6a06a"/>
      <stop offset="100%" stop-color="#a86f42"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ea"/>
      <stop offset="55%" stop-color="#e4d9b8"/>
      <stop offset="100%" stop-color="#9c8b5e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="170" rx="120" ry="122" fill="none" stroke="#ff8c1a" stroke-width="3" opacity="0.28" filter="url(#glow)"/>

  <!-- royal shawl draped behind, trailing at the sides so it doesn't hide the limbs -->
  <path d="M108,140 C78,158 66,206 74,240 L94,236 C90,204 96,168 118,146 Z" fill="url(#cloakGrad)" stroke="#7a3208" stroke-width="2"/>
  <path d="M192,140 C222,158 234,206 226,240 L206,236 C210,204 204,168 182,146 Z" fill="url(#cloakGrad)" stroke="#7a3208" stroke-width="2"/>

  <!-- back/raised sword arm: shoulder -> elbow -> fist -->
  <path d="M104,148 C82,158 62,168 48,178 C40,184 38,196 44,204 C52,210 62,206 68,198 C80,186 96,168 112,156 Z"
        fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <!-- sword blade + hilt, gripped in the raised fist, angled up like a ready strike -->
  <g transform="translate(46,200) rotate(-52)">
    <rect x="-7" y="-6" width="14" height="20" rx="3" fill="#5a3c18" stroke="#2a1a08" stroke-width="1.5"/>
    <rect x="-16" y="10" width="32" height="7" rx="2" fill="#c9a227" stroke="#6a4c10" stroke-width="1.5"/>
    <path d="M-5,17 L5,17 L3,108 L0,120 L-3,108 Z" fill="url(#bladeGrad)" stroke="#3a3220" stroke-width="2"/>
  </g>

  <!-- off-hand arm resting near hip / scabbard -->
  <path d="M196,148 C216,160 228,178 230,198 C230,208 222,214 213,210 C207,204 204,190 198,176 C193,166 190,156 188,148 Z"
        fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <rect x="205" y="196" width="10" height="46" rx="4" fill="#5a3c18" stroke="#2a1a08" stroke-width="1.5" transform="rotate(8 210 196)"/>

  <!-- legs, dhoti trousers, stance slightly apart -->
  <path d="M126,206 C118,232 114,256 118,278 L140,278 C142,254 144,228 144,206 Z" fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <path d="M174,206 C182,232 187,256 184,278 L162,278 C160,254 158,228 158,206 Z" fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <ellipse cx="127" cy="282" rx="15" ry="7" fill="#3a2010"/>
  <ellipse cx="175" cy="282" rx="15" ry="7" fill="#3a2010"/>

  <!-- angarkha tunic, diagonal wrap-front -->
  <path d="M150,144 L182,164 L172,214 L150,226 L128,214 L118,164 Z" fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <path d="M150,152 C160,172 162,198 155,220 L150,224 L145,220 C138,198 140,172 150,152 Z" fill="#c9600f" opacity="0.75"/>
  <!-- waist sash -->
  <rect x="122" y="196" width="56" height="13" rx="3" fill="#7a1f1f"/>
  <circle cx="150" cy="202" r="6" fill="#ffcf40" opacity="0.9"/>

  <!-- neck -->
  <rect x="138" y="118" width="24" height="20" rx="6" fill="url(#skinGrad)"/>

  <!-- pagadi (Maratha turban), rounded with wrapped-cloth pleats -->
  <path d="M150,32 C192,34 208,68 202,100 C198,116 102,116 98,100 C92,68 108,34 150,32 Z"
        fill="url(#turbanGrad)" stroke="#8a4408" stroke-width="2"/>
  <path d="M110,58 C130,50 170,50 190,58" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <path d="M106,76 C128,68 172,68 194,76" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <path d="M103,92 C126,86 174,86 197,92" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <!-- turban jewel (sarpech-style ornament) -->
  <path d="M150,34 L157,54 L150,63 L143,54 Z" fill="#ffcf40" stroke="#8a4408" stroke-width="1.5"/>
  <circle cx="150" cy="39" r="4.5" fill="#ff2b4d"/>

  <!-- face, visible features -->
  <ellipse cx="150" cy="106" rx="30" ry="28" fill="url(#skinGrad)" stroke="#6a4626" stroke-width="1.5"/>
  <path d="M126,98 C132,92 142,90 150,92" fill="none" stroke="#2a1a0c" stroke-width="3" stroke-linecap="round"/>
  <path d="M174,98 C168,92 158,90 150,92" fill="none" stroke="#2a1a0c" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="138" cy="104" rx="3.4" ry="4.6" fill="#1a0f08"/>
  <ellipse cx="162" cy="104" rx="3.4" ry="4.6" fill="#1a0f08"/>
  <path d="M150,106 L147,118 C147,121 150,123 153,120" fill="none" stroke="#7a5636" stroke-width="2" stroke-linecap="round"/>
  <path d="M128,124 C136,132 144,134 150,134 C156,134 164,132 172,124 C166,120 160,126 150,126 C140,126 134,120 128,124 Z" fill="#2a1a0c"/>
  <path d="M144,133 C147,136 153,136 156,133" fill="none" stroke="#5a3018" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
</svg>
