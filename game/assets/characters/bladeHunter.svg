<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="cloakGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#e0731c"/>
      <stop offset="100%" stop-color="#a6440a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#f5ecd8"/>
      <stop offset="100%" stop-color="#dcd0ac"/>
    </radialGradient>
    <radialGradient id="turbanGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#ffab4a"/>
      <stop offset="100%" stop-color="#c9600f"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="150" cy="170" rx="105" ry="112" fill="none" stroke="#ff8c1a" stroke-width="3" opacity="0.28" filter="url(#glow)"/>

  <!-- royal shawl, clean dignified drape (not tattered - a ruler, not a scavenger) -->
  <path d="M112,132 C74,160 56,214 68,266 C90,296 210,296 232,266 C244,214 226,160 188,132
           C182,152 118,152 112,132 Z" fill="url(#cloakGrad)"/>
  <path d="M112,132 C92,176 90,228 100,268" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="3"/>
  <path d="M188,132 C208,176 210,228 200,268" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="3"/>

  <!-- angarkha tunic, diagonal wrap-front -->
  <path d="M150,140 L176,162 L169,244 L150,258 L131,244 L124,162 Z" fill="url(#bodyGrad)" stroke="#8a6a2a" stroke-width="2.5"/>
  <path d="M150,150 C158,168 160,205 154,240 L150,246 L146,240 C142,205 142,168 150,150 Z" fill="#c9600f" opacity="0.75"/>
  <!-- waist sash -->
  <rect x="126" y="208" width="48" height="12" rx="3" fill="#7a1f1f"/>
  <circle cx="150" cy="214" r="6" fill="#ffcf40" opacity="0.9"/>

  <!-- pagadi (Maratha turban), rounded with wrapped-cloth pleats -->
  <path d="M150,52 C190,54 206,88 200,120 C196,136 104,136 100,120 C94,88 110,54 150,52 Z"
        fill="url(#turbanGrad)" stroke="#8a4408" stroke-width="2"/>
  <path d="M112,78 C130,70 170,70 188,78" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <path d="M108,96 C128,88 172,88 192,96" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <path d="M105,112 C126,106 174,106 195,112" fill="none" stroke="#8a4408" stroke-width="2" opacity="0.6"/>
  <!-- turban jewel (sarpech-style ornament) -->
  <path d="M150,54 L156,72 L150,80 L144,72 Z" fill="#ffcf40" stroke="#8a4408" stroke-width="1.5"/>
  <circle cx="150" cy="58" r="4" fill="#ff2b4d"/>

  <!-- face in shadow, dignified mustache -->
  <ellipse cx="150" cy="122" rx="24" ry="20" fill="#3a2415" opacity="0.9"/>
  <path d="M136,130 C142,136 158,136 164,130" fill="none" stroke="#1a0f08" stroke-width="3" opacity="0.85"/>

  <ellipse cx="136" cy="274" rx="12" ry="6" fill="#3a2010" opacity="0.75"/>
  <ellipse cx="164" cy="274" rx="12" ry="6" fill="#3a2010" opacity="0.75"/>
</svg>
