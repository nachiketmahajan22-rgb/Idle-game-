  <path d="M150,142 L174,163 L167,246 L150,260 L133,246 L126,163 Z" fill="url(#bodyGrad)" stroke="#5c4a28" stroke-width="2.5"/>
  <path d="M150,150 C158,168 160,206 154,242 L150,248 L146,242 C140,206 140,168 150,150 Z" fill="#a3811a" opacity="0.7"/>
  <rect x="127" y="210" width="46" height="11" rx="3" fill="#5c3a1a"/>

  <!-- riding crop + horseshoe motif, marking a cavalry commander -->
  <path d="M188,190 L206,232" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
  <path d="M118,222 a12,10 0 1,0 24,0 a12,10 0 1,0 -24,0" fill="none" stroke="#e0b84a" stroke-width="4"/>

  <path d="M150,56 C186,58 200,90 194,118 C190,132 110,132 106,118 C100,90 114,58 150,56 Z"
