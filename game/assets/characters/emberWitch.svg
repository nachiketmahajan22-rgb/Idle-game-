  <path d="M110,98 C130,91 170,91 190,98" fill="none" stroke="#5c4408" stroke-width="2" opacity="0.6"/>
  <path d="M107,112 C128,107 172,107 193,112" fill="none" stroke="#5c4408" stroke-width="2" opacity="0.6"/>
  <path d="M150,58 L155,74 L150,81 L145,74 Z" fill="#ffcf40" stroke="#5c4408" stroke-width="1.5"/>

  <ellipse cx="150" cy="120" rx="23" ry="19" fill="#2a2010" opacity="0.9"/>
