<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bodyGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#4a4a54"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </radialGradient>
    <radialGradient id="turbanGrad" cx="30%" cy="15%" r="90%">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#141418"/>
    </radialGradient>
    <radialGradient id="skinGrad" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#c8926a"/>
      <stop offset="100%" stop-color="#8f5c3a"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2e0"/>
      <stop offset="55%" stop-color="#dcc9a0"/>
      <stop offset="100%" stop-color="#8a7550"/>
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="170" rx="128" ry="128" fill="none" stroke="#ff2b4d" stroke-width="3" opacity="0.3"/>

  <!-- broad armored legs -->
  <path d="M118,208 C108,236 104,262 108,284 L136,284 C138,258 140,230 140,208 Z" fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="3"/>
  <path d="M182,208 C192,236 196,262 192,284 L164,284 C162,258 160,230 160,208 Z" fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="3"/>
  <ellipse cx="120" cy="288" rx="17" ry="8" fill="#0c0c10"/>
  <ellipse cx="180" cy="288" rx="17" ry="8" fill="#0c0c10"/>

  <!-- broad armored torso, bulkier than the rank-and-file -->
  <path d="M150,140 L192,160 L180,220 L150,236 L120,220 L108,160 Z" fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="3"/>
  <path d="M150,150 C162,172 165,202 156,228 L150,234 L144,228 C135,202 138,172 150,150 Z" fill="#141418" opacity="0.7"/>
  <rect x="112" y="196" width="76" height="15" rx="4" fill="#0c0c10"/>
  <circle cx="150" cy="203" r="7" fill="#ff2b4d" opacity="0.9"/>

  <!-- shoulder plates -->
  <ellipse cx="108" cy="156" rx="22" ry="18" fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="2.5"/>
  <ellipse cx="192" cy="156" rx="22" ry="18" fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="2.5"/>

  <!-- both arms gripping one long two-handed blade, raised diagonally overhead -->
  <path d="M96,148 C74,140 52,134 34,132 C25,132 20,140 23,148 C28,155 38,155 48,152 C64,148 82,148 100,150 Z"
        fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="2.5"/>
  <path d="M204,148 C222,132 240,116 252,98 C257,91 266,92 268,101 C266,111 258,120 250,128 C234,142 216,152 202,158 Z"
        fill="url(#bodyGrad)" stroke="#0c0c10" stroke-width="2.5"/>

  <g transform="translate(40,140) rotate(-58)">
    <rect x="-9" y="-8" width="18" height="26" rx="4" fill="#2a1a10" stroke="#0c0c10" stroke-width="2"/>
    <rect x="-20" y="14" width="40" height="9" rx="3" fill="#8a1414" stroke="#0c0c10" stroke-width="2"/>
    <path d="M-7,22 L7,22 L4,150 L0,166 L-4,150 Z" fill="url(#bladeGrad)" stroke="#2a2418" stroke-width="2.5"/>
  </g>

  <rect x="136" y="118" width="28" height="22" rx="7" fill="url(#skinGrad)"/>

  <!-- heavy siege helm with a central spike, no visible pagadi pleats - a warlord, not a courtier -->
  <path d="M104,110 C100,72 122,42 150,40 C178,42 200,72 196,110 C192,126 108,126 104,110 Z"
        fill="url(#turbanGrad)" stroke="#050506" stroke-width="2.5"/>
  <path d="M144,40 L156,40 L152,10 L148,10 Z" fill="#ff2b4d" stroke="#050506" stroke-width="1.5"/>
  <path d="M112,86 C130,78 170,78 188,86" fill="none" stroke="#050506" stroke-width="2" opacity="0.6"/>
  <path d="M108,102 C128,96 172,96 192,102" fill="none" stroke="#050506" stroke-width="2" opacity="0.6"/>

  <!-- brow guard -->
  <path d="M110,102 C128,94 172,94 190,102 L188,112 C168,106 132,106 112,112 Z" fill="#0c0c10"/>

  <!-- face, visible below the brow guard -->
  <ellipse cx="150" cy="120" rx="29" ry="24" fill="url(#skinGrad)" stroke="#5a3a20" stroke-width="1.5"/>
  <ellipse cx="139" cy="120" rx="3.4" ry="4.4" fill="#0e0806"/>
  <ellipse cx="161" cy="120" rx="3.4" ry="4.4" fill="#0e0806"/>
  <path d="M128,138 C136,145 144,147 150,147 C156,147 164,145 172,138 C166,133 159,139 150,139 C141,139 134,133 128,138 Z" fill="#100a06"/>
</svg>
